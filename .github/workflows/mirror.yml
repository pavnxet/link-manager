name: Mirror to Codeberg

on:
  push:
    branches:
      - gemini-flash-link-manager-v2.0   # Trigger only on pushes to this branch

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Fetch all branches and tags

      - name: Mirror to Codeberg
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CODEBERG_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -t rsa codeberg.org >> ~/.ssh/known_hosts

          git remote add mirror git@codeberg.org:pavnxet/link-manager.git

          # Push all remote-tracking branches (from GitHub) as real branches on Codeberg
          # --force ensures updates; --prune is removed to avoid deleting the default branch
          git push --force mirror "refs/remotes/origin/*:refs/heads/*" "refs/tags/*:refs/tags/*"
